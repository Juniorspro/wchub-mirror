<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#aecbe8" />
  <title>PATIO v2 · maplab</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #aecbe8; }
    #scene { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
    /* VHS header strip */
    #hud {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: calc(env(safe-area-inset-top, 0px) + 6px) 12px 6px 12px;
      font: 700 12px/1.3 ui-monospace, 'Courier New', monospace;
      color: #f4f7e8; text-shadow: 0 1px 0 #0008, 0 0 6px #0006;
      pointer-events: none; letter-spacing: 0.08em;
    }
    #hud .rec { color: #ff5b4d; animation: blink 1.2s steps(2) infinite; }
    @keyframes blink { 50% { opacity: 0.15; } }
    #hint {
      position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
      left: 0; right: 0; text-align: center; z-index: 10;
      font: 600 11px/1.4 ui-monospace, 'Courier New', monospace;
      color: #ffffffd9; text-shadow: 0 1px 2px #0009;
      pointer-events: none; letter-spacing: 0.06em;
      transition: opacity 1s ease;
    }
    /* sutiles scanlines PS1/VHS */
    #scan {
      position: fixed; inset: 0; z-index: 9; pointer-events: none;
      background: repeating-linear-gradient(0deg, #0000 0px, #0000 3px, #00000010 3px, #00000010 4px);
      mix-blend-mode: multiply;
    }
    #err {
      position: fixed; left: 0; top: 0; right: 0; z-index: 99;
      background: #300; color: #f99; font: 12px ui-monospace, monospace;
      padding: 10px; white-space: pre-wrap; display: none;
    }
    /* ── entrada obligatoria: dibujá tu cara + nombre ── */
    #intro {
      position: fixed; inset: 0; z-index: 50; display: flex;
      align-items: center; justify-content: center;
      background: rgba(10, 14, 24, 0.82); backdrop-filter: blur(3px);
    }
    #ibox {
      background: #141a2a; border: 2px solid #e8c84a; border-radius: 14px;
      padding: 18px 20px calc(env(safe-area-inset-bottom, 0px) + 18px) 20px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      font: 700 13px/1.4 ui-monospace, 'Courier New', monospace; color: #f3ecd9;
      max-width: 92vw;
    }
    #ibox .ittl { font-size: 18px; letter-spacing: 0.12em; color: #e8c84a; }
    #ibox .isub { font-size: 11px; opacity: 0.8; font-weight: 600; }
    #ballwrap { display: flex; align-items: center; gap: 12px; }
    #ballcv {
      width: min(56vw, 250px); height: min(56vw, 250px);
      border-radius: 14px; border: 2px solid #3a4666; touch-action: none;
      background: #0b0e18; cursor: crosshair;
    }
    #ballrot {
      width: 64px; height: 64px; border-radius: 50%;
      background: #0d1220; border: 2px solid #3a4666;
      display: flex; align-items: center; justify-content: center;
      touch-action: none; cursor: grab; font-size: 22px; color: #8a90a8;
      user-select: none; -webkit-user-select: none;
    }
    #ballrot:active { border-color: #e8c84a; }
    .inkrow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    #baserow {
      display: flex; gap: 7px; align-items: center;
      font-size: 11px; color: #8a90a8;
    }
    #baserow .tool { width: 26px; height: 26px; }
    .tool {
      width: 34px; height: 34px; border-radius: 50%; border: 2px solid #ffffff44;
      cursor: pointer; font: 700 14px ui-monospace, monospace;
      display: flex; align-items: center; justify-content: center;
    }
    .tool.on { border-color: #e8c84a; box-shadow: 0 0 8px #e8c84a88; }
    #iname {
      width: 100%; box-sizing: border-box; padding: 9px 12px;
      border-radius: 8px; border: 2px solid #3a4666; background: #0d1220;
      color: #f3ecd9; font: 700 14px ui-monospace, monospace; text-align: center;
      outline: none;
    }
    #iname:focus { border-color: #e8c84a; }
    #ienter {
      width: 100%; padding: 11px; border-radius: 8px; border: 0;
      background: #e8c84a; color: #1d2540; font: 800 14px ui-monospace, monospace;
      letter-spacing: 0.1em; cursor: pointer;
    }
    #ienter:disabled { background: #4a5068; color: #9aa0b8; cursor: not-allowed; }
    /* ── botones de acción (sentarse / emotes / saltar / ragdoll / tienda) ── */
    #sitbtn, #emobtn, #jumpbtn, #ragbtn, #shopbtn {
      position: fixed; z-index: 12; display: none;
      width: 56px; height: 56px; border-radius: 50%;
      background: rgba(16, 32, 74, 0.9); border: 2px solid #e8c84a;
      color: #f3ecd9; font: 700 22px ui-monospace, monospace;
      align-items: center; justify-content: center; cursor: pointer;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    #emobtn  { right: 16px;  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
    #jumpbtn { right: 82px;  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
    #ragbtn  { right: 148px; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
    #sitbtn  { right: 16px;  bottom: calc(env(safe-area-inset-bottom, 0px) + 82px); font-size: 24px; }
    #shopbtn { right: 82px;  bottom: calc(env(safe-area-inset-bottom, 0px) + 82px); }
    #shoppanel {
      position: fixed; right: 12px; z-index: 14; display: none;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 150px);
      background: rgba(16, 32, 74, 0.95); border: 2px solid #e8c84a;
      border-radius: 14px; padding: 12px; max-width: 86vw;
      font: 700 12px ui-monospace, monospace; color: #f3ecd9;
      touch-action: none;
    }
    .shoptitle { margin-bottom: 8px; letter-spacing: 0.06em; color: #e8c84a; }
    .swrow { display: flex; flex-wrap: wrap; gap: 7px; max-width: 280px; }
    .sw {
      width: 34px; height: 34px; border-radius: 50%;
      border: 2px solid #ffffff55; cursor: pointer;
    }
    .sw:active { border-color: #e8c84a; }
    .shopitem {
      padding: 8px 10px; border-radius: 9px; background: #0d1220;
      border: 1px solid #ffffff22; cursor: pointer; font-size: 13px;
    }
    .shopitem:active { background: #e8c84a; color: #1d2540; }
    .shopclose { margin-top: 8px; text-align: center; }
    #emopanel {
      position: fixed; right: 12px; z-index: 13; display: none;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
      background: rgba(16, 32, 74, 0.94); border: 2px solid #e8c84a;
      border-radius: 14px; padding: 10px;
      grid-template-columns: repeat(6, 44px); gap: 6px;
      touch-action: none;
    }
    .emo {
      width: 44px; height: 44px; border-radius: 10px; border: 1px solid #ffffff22;
      background: #0d1220; font-size: 24px; display: flex;
      align-items: center; justify-content: center; cursor: pointer;
      user-select: none; -webkit-user-select: none;
    }
    .emo:active { background: #e8c84a; }
    /* ── joystick táctil ── */
    #joy {
      position: fixed; left: 18px; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      width: 124px; height: 124px; border-radius: 50%; z-index: 12;
      background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25);
      touch-action: none; display: none;
    }
    #knob {
      position: absolute; left: 50%; top: 50%; width: 52px; height: 52px;
      border-radius: 50%; background: rgba(255,255,255,0.35);
      border: 2px solid rgba(255,255,255,0.5);
      transform: translate(-50%, -50%); pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hud"><span><span class="rec">●</span> PATIO v2</span><span>WCHUB · MAPLAB</span></div>
  <canvas id="scene"></canvas>
  <div id="scan"></div>
  <div id="hint">arrastrá para girar · pellizcá para zoom</div>
  <div id="joy"><div id="knob"></div></div>
  <div id="sitbtn">🪑</div>
  <div id="emobtn">😀</div>
  <div id="jumpbtn">🦘</div>
  <div id="ragbtn">🤸</div>
  <div id="shopbtn">🛍</div>
  <div id="emopanel"></div>
  <div id="shoppanel"></div>
  <div id="phint" style="display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 152px);z-index:11;background:#10204aee;border:2px solid #e8c84a;border-radius:10px;padding:8px 14px;font:700 12px/1.3 ui-monospace,'Courier New',monospace;color:#f3ecd9;letter-spacing:0.04em;pointer-events:none;max-width:88vw;text-align:center"></div>
  <div id="intro">
    <div id="ibox">
      <div class="ittl">⚽ PATIO MUNDIAL</div>
      <div class="isub">pintá tu cabeza en la bola 3D (girala con el 🔄) y poné tu nombre</div>
      <div id="tools" class="inkrow">
        <div class="tool on" data-c="#2b1c12" style="background:#2b1c12"></div>
        <div class="tool" data-c="#c1272d" style="background:#c1272d"></div>
        <div class="tool" data-c="#1d3a8f" style="background:#1d3a8f"></div>
        <div class="tool" data-c="#1d7a3a" style="background:#1d7a3a"></div>
        <div class="tool" data-c="#e8c84a" style="background:#e8c84a"></div>
        <div class="tool" data-c="#f4f4ee" style="background:#f4f4ee"></div>
      </div>
      <div id="ballwrap">
        <canvas id="ballcv" width="300" height="300"></canvas>
        <div id="ballrot">🔄</div>
      </div>
      <div id="tools2" class="inkrow">
        <div class="tool" data-c="#ff7a5c" style="background:#ff7a5c"></div>
        <div class="tool" data-c="#d96bc4" style="background:#d96bc4"></div>
        <div class="tool" data-c="#6bd0ff" style="background:#6bd0ff"></div>
        <div class="tool" data-c="#7a4a2a" style="background:#7a4a2a"></div>
        <div class="tool" data-c="ERASE" style="background:#e8b88f">⌫</div>
        <div class="tool" data-c="CLEAR" style="background:#3a4666;color:#fff">✕</div>
      </div>
      <div id="baserow">
        <span>bola:</span>
        <div class="tool on" data-b="#e8b88f" style="background:#e8b88f"></div>
        <div class="tool" data-b="#c98a5e" style="background:#c98a5e"></div>
        <div class="tool" data-b="#8a573a" style="background:#8a573a"></div>
        <div class="tool" data-b="#f2d1b3" style="background:#f2d1b3"></div>
        <div class="tool" data-b="#9bd96b" style="background:#9bd96b"></div>
        <div class="tool" data-b="#6bd0ff" style="background:#6bd0ff"></div>
        <div class="tool" data-b="#e8c84a" style="background:#e8c84a"></div>
      </div>
      <input id="iname" maxlength="14" placeholder="tu nombre…" autocomplete="off" />
      <button id="ienter" disabled>ENTRAR AL PATIO</button>
    </div>
  </div>
  <div id="err"></div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
